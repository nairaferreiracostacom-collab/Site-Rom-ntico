<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria de Fotos</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
  }

  body {
    background: #0a0a0a;
    color: white;
    overflow: hidden;
  }

  /* TELA INICIAL */
  #inicio {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1e0033 0%, #4a0072 50%, #000 100%);
    z-index: 10;
    transition: opacity 0.8s ease, visibility 0.8s;
    text-align: center;
    padding: 20px;
  }

  #inicio::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: 
      radial-gradient(circle at 20% 30%, rgb(230, 0, 255) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgb(170, 15, 242) 0%, transparent 40%);
    animation: brilho 6s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes brilho {
    0% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  #inicio.escondido {
    opacity: 0;
    visibility: hidden;
  }

  #inicio h1 {
    font-size: clamp(2rem, 6vw, 4rem);
    background: linear-gradient(90deg, #1d1b1cf9, #1d1c1b, #1b1d1d);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 20px;
    animation: pulse 3s infinite;
    z-index: 1;
    letter-spacing: 2px;
    font-weight: 800;
  }

  #inicio p {
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    color: #ccc;
    margin-bottom: 40px;
    z-index: 1;
    max-width: 500px;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  #btn-entrar {
    padding: 18px 50px;
    font-size: 1.2rem;
    font-weight: bold;
    color: white;
    background: linear-gradient(45deg, #dec8d9, #dad3cf);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    z-index: 1;
    box-shadow: 0 0 20px rgba(255, 0, 204, 0.6);
    transition: all 0.3s ease;
    letter-spacing: 1px;
  }

  #btn-entrar:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 0 40px rgba(222, 202, 218, 0.9);
  }

  #btn-entrar:active {
    transform: scale(0.97);
  }

  /* CARROSSEL */
  #carrossel-container {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0a0a0a;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.8s ease, visibility 0.8s;
  }

  #carrossel-container.visivel {
    opacity: 1;
    visibility: visible;
  }

  .carrossel {
    position: relative;
    width: 90vw;
    max-width: 900px;
    height: 70vh;
    max-height: 600px;
    overflow: hidden;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(255, 0, 204, 0.3),
                0 0 100px rgba(0, 200, 255, 0.2);
  }

  .slides {
    display: flex;
    height: 100%;
    transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1);
  }

  .slide {
    min-width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .slide-numero {
    position: absolute;
    bottom: 20px;
    right: 25px;
    background: rgba(0, 0, 0, 0.6);
    color: white;
    padding: 8px 16px;
    border-radius: 30px;
    font-size: 0.95rem;
    font-weight: bold;
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  /* BOTÕES SETA */
  .seta {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.3);
    color: white;
    font-size: 1.5rem;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.3s ease;
    z-index: 5;
    user-select: none;
  }

  .seta:hover {
    background: linear-gradient(45deg, #ff00cc, #ff6600);
    transform: translateY(-50%) scale(1.15);
    box-shadow: 0 0 25px rgba(255, 0, 204, 0.8);
    border-color: transparent;
  }

  .seta:active {
    transform: translateY(-50%) scale(0.95);
  }

  .seta-esquerda { left: 20px; }
  .seta-direita { right: 20px; }

  /* INDICADORES (bolinhas) */
  .indicadores {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 5;
    background: rgba(0, 0, 0, 0.4);
    padding: 10px 18px;
    border-radius: 30px;
    backdrop-filter: blur(8px);
  }

  .bolinha {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.4);
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .bolinha.ativa {
    background: linear-gradient(45deg, #ff00cc, #ff6600);
    width: 30px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(255, 0, 204, 0.8);
  }

  /* BOTÃO VOLTAR */
  #btn-voltar {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    border-radius: 30px;
    cursor: pointer;
    z-index: 6;
    backdrop-filter: blur(8px);
    font-size: 0.9rem;
    transition: all 0.3s ease;
  }

  #btn-voltar:hover {
    background: rgba(255, 0, 204, 0.5);
    border-color: transparent;
  }

  /* RESPONSIVO */
  @media (max-width: 600px) {
    .seta {
      width: 45px;
      height: 45px;
      font-size: 1.2rem;
    }
    .seta-esquerda { left: 10px; }
    .seta-direita { right: 10px; }
    .carrossel {
      width: 95vw;
      height: 60vh;
    }
    .indicadores {
      gap: 6px;
      padding: 8px 12px;
    }
    .bolinha {
      width: 9px;
      height: 9px;
    }
    .bolinha.ativa {
      width: 22px;
    }
  }
</style>
</head>
<body>

  <!-- TELA INICIAL -->
  <div id="inicio">
    <h1>✨ Nossa Galeria ✨</h1>
    <p>Em especial de 2 meses ao seu lado,
      Saiba que você merece mais que um site!
    eu te amo mais que tudo.</p>
    <button id="btn-entrar">Ver Carrossel →</button>
  </div>

  <!-- CARROSSEL -->
  <div id="carrossel-container">
    <button id="btn-voltar">← Voltar</button>

    <div class="carrossel">
      <div class="slides" id="slides">
        <!-- Slides serão inseridos via JS -->
      </div>

      <button class="seta seta-esquerda" id="prev">❮</button>
      <button class="seta seta-direita" id="next">❯</button>

      <div class="indicadores" id="indicadores"></div>
    </div>
  </div>

<script>
  // ====== CONFIGURAÇÃO DAS FOTOS ======
  // Substitua as URLs pelas suas 9 fotos (ou use links do Unsplash como exemplo)
  const fotos = [
    "foto 10.jpeg",
    "foto 2.jpeg",
    "foto 3.jpeg",
    "foto 4.jpeg",
    "foto 5.jpeg",
    "foto 6.jpeg",
    "foto 7.jpeg",
    "foto 8.jpeg",
    "foto 9.jpeg"
  ];

  const slidesContainer = document.getElementById('slides');
  const indicadoresContainer = document.getElementById('indicadores');
  let indiceAtual = 0;

  // Criar slides
  fotos.forEach((url, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.innerHTML = `
      <img src="${url}" alt="Foto ${i + 1}" loading="lazy">
      <span class="slide-numero">${i + 1} / ${fotos.length}</span>
    `;
    slidesContainer.appendChild(slide);

    // Criar bolinha
    const bolinha = document.createElement('div');
    bolinha.className = 'bolinha' + (i === 0 ? ' ativa' : '');
    bolinha.addEventListener('click', () => irPara(i));
    indicadoresContainer.appendChild(bolinha);
  });

  const slides = document.querySelectorAll('.slide');
  const bolinhas = document.querySelectorAll('.bolinha');

  function atualizarCarrossel() {
    slidesContainer.style.transform = `translateX(-${indiceAtual * 100}%)`;
    bolinhas.forEach((b, i) => {
      b.classList.toggle('ativa', i === indiceAtual);
    });
  }

  function proximo() {
    indiceAtual = (indiceAtual + 1) % slides.length;
    atualizarCarrossel();
  }

  function anterior() {
    indiceAtual = (indiceAtual - 1 + slides.length) % slides.length;
    atualizarCarrossel();
  }

  function irPara(i) {
    indiceAtual = i;
    atualizarCarrossel();
  }

  document.getElementById('next').addEventListener('click', proximo);
  document.getElementById('prev').addEventListener('click', anterior);

  // Teclado
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') proximo();
    if (e.key === 'ArrowLeft') anterior();
  });

  // Swipe (mobile)
  let inicioX = 0;
  const carrossel = document.querySelector('.carrossel');
  carrossel.addEventListener('touchstart', (e) => {
    inicioX = e.touches[0].clientX;
  });
  carrossel.addEventListener('touchend', (e) => {
    const fimX = e.changedTouches[0].clientX;
    const dif = inicioX - fimX;
    if (Math.abs(dif) > 50) {
      dif > 0 ? proximo() : anterior();
    }
  });

  // Autoplay (opcional - remova se não quiser)
  let autoplay = setInterval(proximo, 5000);
  carrossel.addEventListener('mouseenter', () => clearInterval(autoplay));
  carrossel.addEventListener('mouseleave', () => {
    autoplay = setInterval(proximo, 5000);
  });

  // ====== NAVEGAÇÃO TELA INICIAL <-> CARROSSEL ======
  const inicio = document.getElementById('inicio');
  const carrosselContainer = document.getElementById('carrossel-container');

  document.getElementById('btn-entrar').addEventListener('click', () => {
    inicio.classList.add('escondido');
    carrosselContainer.classList.add('visivel');
  });

  document.getElementById('btn-voltar').addEventListener('click', () => {
    inicio.classList.remove('escondido');
    carrosselContainer.classList.remove('visivel');
  });
</script>

</body>
</html>
